<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bgGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(99, 102, 241, 0.08);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(45, 27, 78, 0.1);stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:rgba(99, 102, 241, 0.15);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(99, 102, 241, 0);stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:rgba(147, 51, 234, 0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(147, 51, 234, 0);stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#060a1e"/>
  <rect width="100%" height="100%" fill="url(#bgGradientDark)"/>
  <rect width="100%" height="100%" fill="url(#glow1)"/>
  <rect width="100%" height="100%" fill="url(#glow2)"/>
  <rect width="100%" height="100%" fill="url(#grid-dark)"/>
</svg>
